<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator SK Mawar</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .menu { display: flex; flex-direction: column; gap: 10px; max-width: 400px; margin: auto; }
        .btn { padding: 15px; background: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        #paparan { display: none; margin-top: 20px; }
        #gambar-pelan { width: 100%; max-width: 600px; border: 5px solid white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .back-btn { padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>NAVIGATOR SK MAWAR</h1>
<p>Pilih tingkat untuk melihat pelan:</p>

<div id="menu-utama" class="menu">
    <button class="btn" onclick="tunjuk('photo_6253424666349342576_y_2.png')">Lantai 2</button>
    <button class="btn" onclick="tunjuk('photo_6253424666349342579_y_2.png')">Lantai 3</button>
    <button class="btn" onclick="tunjuk('photo_6253424666349342580_y_2.png')">Lantai Bawah</button>
</div>

<div id="paparan">
    <img id="gambar-pelan" src="" alt="Pelan Lantai">
    <br>
    <button class="back-btn" onclick="tutup()">Kembali ke Menu</button>
</div>

<script>
    function tunjuk(namaGambar) {
        document.getElementById('menu-utama').style.display = 'none';
        document.getElementById('paparan').style.display = 'block';
        document.getElementById('gambar-pelan').src = namaGambar;
    }
    function tutup() {
        document.getElementById('menu-utama').style.display = 'flex';
        document.getElementById('paparan').style.display = 'none';
    }
</script>

</body>
</html>
