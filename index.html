<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator SK Mawar</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #eef2f3; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #2980b9; }
        #paparan { display: none; margin-top: 20px; }
        #gambar-pelan { width: 100%; border: 4px solid #3498db; border-radius: 10px; }
        .back-btn { padding: 12px 25px; background: #e74c3c; color: white; border: none; border-radius: 5px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>NAVIGATOR SK MAWAR</h1>
    <p>Pilih destinasi di bawah:</p>

    <div id="menu-utama">
        <button class="btn" onclick="tunjuk('photo_6253424666349342576_y.png')">Lantai 2</button>
        <button class="btn" onclick="tunjuk('photo_6253424666349342579_y.png')">Lantai 3</button>
        <button class="btn" onclick="tunjuk('photo_6253424666349342580_y.png')">Lantai Bawah</button>
        <button class="btn" onclick="tunjuk('photo_6253424666349342569_y.png')">Pejabat</button>
    </div>

    <div id="paparan">
        <img id="gambar-pelan" src="" alt="Pelan Sekolah">
        <br>
        <button class="back-btn" onclick="tutup()">Kembali</button>
    </div>
</div>

<script>
    function tunjuk(namaGambar) {
        document.getElementById('menu-utama').style.display = 'none';
        document.getElementById('paparan').style.display = 'block';
        document.getElementById('gambar-pelan').src = namaGambar;
    }
    function tutup() {
        document.getElementById('menu-utama').style.display = 'block';
        document.getElementById('paparan').style.display = 'none';
    }
</script>

</body>
</html>
